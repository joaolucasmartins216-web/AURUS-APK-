name: Gerar APK (AURUS GYM)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir o zip do projeto
        run: unzip -q aurus-gym-pronto-para-apk.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        working-directory: aureus
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web + sincronizar com Android
        working-directory: aureus
        run: npm run cap:sync

      - name: Compilar APK (debug)
        working-directory: aureus/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: aurus-gym-apk
          path: aureus/android/app/build/outputs/apk/debug/app-debug.apk
